<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQL Bee — Learn SQL &amp; Crack Interviews</title>
<link rel="stylesheet" href="vendor/codemirror.min.css" />
<link rel="stylesheet" href="vendor/show-hint.min.css" />
<link rel="stylesheet" href="styles/app.css?v=12" />
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-logo">🐝</div>
    <div class="boot-text">Starting the database engine…</div>
    <div class="boot-bar"><span></span></div>
  </div>
</div>

<header class="topbar">
  <button class="icon-btn" id="btnQuestions" title="All questions">☰</button>
  <div class="brand">
    <span class="brand-name">SQL Bee</span>
    <svg class="bee-mark" viewBox="0 0 64 64" aria-label="SQL Bee logo" role="img">
      <!-- honeycomb backing -->
      <g class="comb" fill="#FDC500">
        <polygon points="52,20 57,23 57,29 52,32 47,29 47,23"/>
        <polygon points="52,33 57,36 57,42 52,45 47,42 47,36"/>
        <polygon points="45,27 50,30 50,36 45,39 40,36 40,30"/>
      </g>
      <!-- antennae -->
      <g stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M22 20 C18 12, 13 9, 10 8"/>
        <path d="M31 18 C31 10, 33 6, 36 4"/>
      </g>
      <circle cx="9" cy="7" r="2.6" fill="#111"/>
      <circle cx="37" cy="3.6" r="2.6" fill="#111"/>
      <!-- wing -->
      <ellipse cx="41" cy="26" rx="10" ry="6.4" transform="rotate(-28 41 26)"
               fill="#fff" stroke="#111" stroke-width="2.4"/>
      <!-- body -->
      <ellipse cx="26" cy="35" rx="19" ry="17" fill="#FDC500" stroke="#111" stroke-width="2.8"/>
      <!-- stripes, clipped to the body -->
      <clipPath id="beeBody"><ellipse cx="26" cy="35" rx="19" ry="17"/></clipPath>
      <g clip-path="url(#beeBody)" fill="#111">
        <rect x="26" y="18" width="7" height="34" transform="rotate(-14 29 35)"/>
        <rect x="37" y="18" width="7" height="34" transform="rotate(-14 40 35)"/>
      </g>
      <!-- face -->
      <g>
        <circle cx="20" cy="31" r="6" fill="#fff" stroke="#111" stroke-width="2.2"/>
        <circle cx="31" cy="31" r="6" fill="#fff" stroke="#111" stroke-width="2.2"/>
        <circle cx="21" cy="32" r="2.7" fill="#111"/>
        <circle cx="32" cy="32" r="2.7" fill="#111"/>
        <path d="M20 41 Q26 46, 32 41" stroke="#111" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="topbar-nav">
    <button class="nav-btn" id="btnPrev" title="Previous question">‹</button>
    <span class="nav-pos" id="navPos">1 / 60</span>
    <button class="nav-btn" id="btnNext" title="Next question">›</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 60 solved</span>
  </div>

  <div class="topbar-actions">
    <span class="byline">
      <span class="byline-text">Made by <strong>Jogesh Kumar Sharma</strong></span>
      <a href="https://www.linkedin.com/in/jogeshkumarsharma" target="_blank" rel="noopener noreferrer"
         title="Jogesh Kumar Sharma on LinkedIn">in</a>
    </span>
    <button class="icon-btn" id="btnTheme" title="Switch theme">☾</button>
    <button class="btn btn-ghost" id="btnReset">Reset</button>
  </div>
</header>

<main class="split" id="split">
  <!-- LEFT: question detail -->
  <section class="pane pane-left" id="paneLeft">
    <div class="q-header">
      <div class="q-header-main">
        <span class="q-index" id="qIndex">#1</span>
        <h1 class="q-title" id="qTitle">Loading…</h1>
      </div>
      <div class="q-header-meta" id="qMeta"></div>
    </div>

    <nav class="qtabs" id="qtabs">
      <button class="qtab active" data-qtab="question">Brief</button>
      <button class="qtab" data-qtab="solution">Walkthrough</button>
      <button class="qtab" data-qtab="approaches">Other ways</button>
      <button class="qtab" data-qtab="dialects">Dialects</button>
      <button class="qtab" data-qtab="submissions">History</button>
    </nav>

    <div class="qtab-body" id="qtabBody"></div>
  </section>

  <div class="splitter" id="splitter" title="Drag to resize"></div>

  <!-- RIGHT: editor + output -->
  <section class="pane pane-right">
    <div class="editor-head">
      <span class="editor-label">Input</span>
      <select class="dialect-select" id="dialectSelect" title="Choose the SQL dialect you are practising"></select>
      <span class="engine-badge" id="engineBadge"></span>
      <div class="editor-head-actions">
        <button class="btn btn-ghost btn-sm" id="btnClear">Clear</button>
        <button class="btn btn-ghost btn-sm" id="btnFormat">Reset</button>
      </div>
    </div>

    <div id="editorHost" class="editor-host"></div>

    <div class="output-head">
      <span class="output-label">Output</span>
      <div class="tabs">
        <button class="tab active" data-tab="result">Your result</button>
        <button class="tab" data-tab="expected">Expected output</button>
      </div>
      <span class="result-status" id="resultStatus"></span>
    </div>

    <div class="output-body" id="resultBody">
      <div class="empty">Run your query to view output.</div>
    </div>

    <div class="action-bar">
      <span class="run-hint">Run shows output · Check grades it</span>
      <button class="btn btn-run" id="btnRun" title="Execute the query (Ctrl+Enter)">Run query</button>
      <button class="btn btn-submit" id="btnSubmit" title="Check your answer (Ctrl+Shift+Enter)">Check answer</button>
    </div>
  </section>
</main>

<!-- Question list drawer -->
<aside class="drawer drawer-left" id="questionDrawer" hidden>
  <div class="drawer-head">
    <h2>All questions</h2>
    <button class="icon-btn" id="btnCloseQuestions">✕</button>
  </div>
  <div class="filters">
    <input type="search" id="searchInput" class="input" placeholder="Search questions…" />
    <div class="filter-row">
      <select id="difficultyFilter" class="select">
        <option value="">All difficulty</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
      <select id="topicFilter" class="select"><option value="">All topics</option></select>
    </div>
    <div class="filter-row">
      <select id="statusFilter" class="select">
        <option value="">All status</option>
        <option value="solved">Solved</option>
        <option value="unsolved">Unsolved</option>
      </select>
    </div>
  </div>
  <ol class="qlist" id="questionList"></ol>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="vendor/sql-wasm.js"></script>
<script src="vendor/codemirror.min.js"></script>
<script src="vendor/sql-mode.min.js"></script>
<script src="vendor/show-hint.min.js"></script>
<script src="vendor/sql-hint.min.js"></script>
<script type="module" src="src/app.js?v=12"></script>
</body>
</html>
